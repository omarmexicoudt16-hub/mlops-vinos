<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clasificador de vinos</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#f6f0f3; display:flex; justify-content:center; padding:40px 16px; }
    .card { background:#fff; max-width:420px; width:100%; padding:28px; border-radius:14px; box-shadow:0 4px 18px rgba(0,0,0,.08); }
    h1 { color:#6b1e3d; margin-top:0; font-size:1.5rem; }
    label { display:block; margin-top:14px; font-size:.9rem; color:#444; }
    input { width:100%; padding:9px; margin-top:4px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; }
    button { margin-top:20px; width:100%; padding:11px; background:#6b1e3d; color:#fff; border:0; border-radius:8px; font-size:1rem; cursor:pointer; }
    #result { margin-top:20px; padding:14px; border-radius:8px; background:#f3e6ec; display:none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🍷 Clasificador de vinos</h1>
    <p>Introduce las características químicas del vino y el modelo predice su tipo (cultivar).</p>
    <form id="form">
      <label>Alcohol (%) <input name="alcohol" type="number" step="0.01" value="13.2" required></label>
      <label>Flavonoides <input name="flavanoids" type="number" step="0.01" value="2.5" required></label>
      <label>Intensidad de color <input name="color_intensity" type="number" step="0.01" value="5.0" required></label>
      <label>Prolina <input name="proline" type="number" step="1" value="1000" required></label>
      <button type="submit">Predecir</button>
    </form>
    <div id="result"></div>
  </div>
  <script>
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target).entries());
      for (const k in body) body[k] = parseFloat(body[k]);
      const box = document.getElementById("result");
      box.style.display = "block";
      try {
        const r = await fetch("/predict", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
        const d = await r.json();
        box.innerHTML = r.ok
          ? `<b>${d.cultivar}</b><br>Confianza: ${(d.confidence * 100).toFixed(1)}%`
          : "Datos inválidos: revisa los valores.";
      } catch (err) { box.textContent = "Error al conectar con la API."; }
    });
  </script>
</body>
</html>
